global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'airflow'
    static_configs:
      - targets: ['airflow-webserver:8080']
    metrics_path: /metrics

  - job_name: 'spark'
    static_configs:
      - targets: ['spark-master:8080']

  - job_name: 'localstack'
    static_configs:
      - targets: ['localstack:4566']
    metrics_path: /_localstack/metrics
